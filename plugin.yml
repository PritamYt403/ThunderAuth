
name: ThunderAuth
version: '1.0.0'
main: com.pritamx.thunderauth.ThunderAuth
api-version: '1.21'
author: Pritam
description: Professional Minecraft Authentication Plugin
website: https://github.com/PritamYt403/ThunderAuth

commands:
  login:
    description: Login to your account
    usage: "/login <password>"
    permission: thunderauth.login

  register:
    description: Register your account
    usage: "/register <password> <confirmPassword>"
    permission: thunderauth.register

  changepassword:
    description: Change your account password
    usage: "/changepassword <oldPassword> <newPassword>"
    aliases: [changepass, cp]
    permission: thunderauth.password

  thunderauth:
    description: ThunderAuth administration
    usage: "/thunderauth reload"
    permission: thunderauth.admin

permissions:
  thunderauth.login:
    description: Allows players to login
    default: true

  thunderauth.register:
    description: Allows players to register
    default: true

  thunderauth.password:
    description: Allows players to change their password
    default: true

  thunderauth.admin:
    description: Allows administrators to reload ThunderAuth
    default: op
    
