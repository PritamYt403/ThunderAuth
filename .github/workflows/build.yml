
name: ThunderAuth Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ThunderAuth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn --version

      - name: Build Plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload Plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAuth-JAR
          path: target/ThunderAuth.jar
          if-no-files-found: error
          retention-days: 14
